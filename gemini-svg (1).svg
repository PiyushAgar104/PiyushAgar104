        <tspan x="15" dy="25">    &gt; System ready for deployment.</tspan>
      </text>

      <!-- Scanline Overlay -->
      <rect x="0" y="0" width="370" height="450" class="scanline" rx="8">
        <animate attributeName="y" values="0;450;0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

