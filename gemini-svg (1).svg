<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Glows -->
    <radialGradient id="dark-bg-glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dark-orb-2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass & Panel Gradients -->
    <linearGradient id="dark-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="dark-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(34,211,238,0.25)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0.1)"/>
    </linearGradient>

    <!-- Text & ASCII Gradients -->
    <linearGradient id="dark-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Filters -->
    <filter id="dark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dark-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #030712; }
    .panel { fill: url(#dark-panel-grad); stroke: url(#dark-border-grad); stroke-width: 1.5; rx: 16px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #F8FAFC; font-size: 26px; }
    .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 13px; }
    .text-highlight { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #F8FAFC; font-size: 13px; }
    .ascii-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: bold; fill: url(#dark-accent-grad); }
    .terminal-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #22D3EE; }
    .pill-bg { fill: rgba(15, 23, 42, 0.9); stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; rx: 6px; }
    .pill-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #CBD5E1; }
    .cursor { fill: #22D3EE; }
    .scanline { fill: rgba(34, 211, 238, 0.03); pointer-events: none; }
  </style>

  <!-- Base Canvas & Background Glows -->
  <rect width="1180" height="610" rx="20" class="bg"/>
  <rect width="1180" height="610" rx="20" fill="url(#dark-bg-glow)"/>
  <rect width="1180" height="610" rx="20" fill="url(#dark-orb-2)"/>

  <!-- Outer Border Shimmer Frame -->
  <rect x="1" y="1" width="1178" height="608" rx="19" fill="none" stroke="url(#dark-border-grad)" stroke-width="1.5" opacity="0.6"/>

