        <tspan x="15" dy="13">    ╚═╝     ╚═╝   ╚═╝    ╚═════╝ ╚══════╝╚═╝  ╚═╝</tspan>
        <tspan x="15" dy="25">    ╔═══════════════════════════════════════════╗</tspan>
        <tspan x="15" dy="14">    ║  [STATUS] ONLINE &amp; COMPILING...           ║</tspan>
